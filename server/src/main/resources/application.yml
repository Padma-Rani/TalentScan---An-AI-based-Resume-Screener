server:
  port: 8080

spring:
  application:
    name: ai-resume-screener-server

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mariadb://localhost:3111/resume_screener
    driver-class-name: org.mariadb.jdbc.Driver
    username: santosh
    password: santosh

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect

# Base URL of the Python FastAPI AI model service
ai-service:
  base-url: http://localhost:8000

# Frontend origin allowed to call this API (Vite dev server)
cors:
  allowed-origins: http://localhost:3100

# JWT_SECRET must be set in the environment (32+ char random string) -- no fallback, server fails fast if unset
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# Set to true once the app is served over HTTPS (required for the browser to send the cookie)
cookie:
  secure: false
